[package]
name = "mario"
version = "1.0.3"
edition = "2024"
build = "build.rs"
authors = ["planet0104- <planet0104-@users.noreply.github.com>"]
description = "Mario - A classic platformer game ported from Pascal to Rust"
repository = "https://github.com/planet0104/MarioRS"
license = "MIT"
keywords = ["game", "mario", "platformer", "retro"]
categories = ["games"]

# 支持编译为动态库 (Android .so) 和静态库
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# GPU 渲染核心依赖 (wgpu-backend feature 启用)
# Desktop 平台使用 Vulkan/DX12，不启用 gles (避免 windows-result 兼容性问题)
wgpu = { version = "28.0.0", default-features = false, features = ["wgsl", "vulkan"], optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
futures = { version = "0.3", optional = true }

# winit 窗口管理 (桌面平台)
# 在 wasm32 上不编译：见下方 target.'cfg(not(target_arch = "wasm32"))'.dependencies
bitflags = "2.9.1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rmp-serde = { version = "1", optional = true }

# Optional logging dependencies (activate via `--features logging`).
# tracing 及相关实现由非-wasm 平台启用（避免在 wasm32 上编译）

# include_dir: compile-time embedding of directories (used by src/sprites.rs)
# Removed: assets are generated at build time into generated_assets.rs
# ============================================================================
# 跨平台音频系统 - cpal (支持 Desktop + WASM + Android + iOS)
# ============================================================================

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Use cpal on non-Windows platforms; Windows uses audio_waveout.rs instead
# cpal moved to a more specific target to avoid compiling on wasm32

# ============================================================================
# 跨平台日志系统（通过 feature 激活，可选依赖以减少 release 体积）
# ============================================================================
# tracing / tracing-subscriber / tracing-wasm / tracing-android 都声明为
# 顶层 optional 依赖（使用 `--features logging` 来激活）。平台特有的
# tracing-wasm / tracing-android 也在各自的 target 块被标注为 optional，
# 但不使用 `debug_assertions` 进行条件选择（Cargo 不支持）。

# ============================================================================
# 跨平台随机数
# - Windows: 使用 Win32 RtlGenRandom (XP+)，无需 getrandom
# - 其他平台: 使用 getrandom
# ============================================================================
[target.'cfg(not(target_os = "windows"))'.dependencies.rand]
version = "0.8"
default-features = false
features = ["alloc", "getrandom", "small_rng"]

[target.'cfg(not(target_os = "windows"))'.dependencies.getrandom]
version = "0.2"

# ============================================================================
# Web平台 (WASM) 特定依赖
# ============================================================================
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# 不在 wasm32 上包含 tracing* 相关库以减小体积并避免平台不兼容代码
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "HtmlCanvasElement",
  "Navigator",
  "Storage",
  "Performance",
  "KeyboardEvent",
  # Web Audio API
  "AudioContext",
  "OscillatorNode",
  "GainNode",
  "AudioNode",
  "AudioParam",
  "AudioDestinationNode",
  "AudioScheduledSourceNode",
  "Event",
  # WebGL2 API (for wxgame-backend)
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlBuffer",
  "WebGlFramebuffer",
  "WebGlUniformLocation",
] }
console_error_panic_hook = "0.1"
base64 = "0.22"
raw-window-handle = "0.6"
# web-time 提供 std::time 在 WASM 上的实现，某些依赖可能需要
web-time = "1.1"
# WASM 平台通常使用浏览器提供的 WebGPU；不要把 `wgpu` 强制加入 wasm 目标以避免引入 profiling 等本地依赖

# 为 Web (wasm32) 添加一个可选的、精简的 wgpu 依赖，默认为关闭。
# 当用户启用 `--features wgpu-backend` 时，
# Cargo 会使用此目标特定配置来拉入适合 Web 的 wgpu 特性。
# - wgpu-backend: 使用 "webgpu" feature (现代浏览器 WebGPU API)
# - wxgame-backend: 使用原生 WebGL API (微信小游戏，不使用 wgpu)
[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
version = "28.0.0"
default-features = false
# wgsl: WGSL 着色器支持
# webgpu: WebGPU 后端 (用于 wgpu-backend)
# fragile-send-sync-non-atomic-wasm: 在非原子 WASM 上实现 Send/Sync
features = ["wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"]
optional = true

# ============================================================================
# 限制依赖以避免在 wasm32 上编译
# ============================================================================
[target.'cfg(all(not(target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
# Use cpal on non-Windows, non-wasm platforms
cpal = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Desktop / non-wasm-only optional deps
winit = { version = "0.30", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

# ============================================================================
# Android平台特定依赖
# ============================================================================
[target.'cfg(target_os = "android")'.dependencies]
# Android Activity 封装 (使用 GameActivity，事件响应更及时)
android-activity = { version = "0.6", features = ["game-activity"] }
# Android NDK 绑定
ndk = "0.9"
ndk-sys = "0.6"
# Android 日志系统
android_logger = "0.14"
log = "0.4"
# tracing-android is optional; activate via `--features logging` when needed.
tracing-android = { version = "0.2", optional = true }
# Android 平台启用 gles 后端 (OpenGL ES)
wgpu = { version = "28.0.0", default-features = false, features = ["wgsl", "vulkan", "gles"], optional = true }

# ============================================================================
# PNG 解码 - 精灵加载必需
# ============================================================================
[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

# ============================================================================
# Windows平台特定依赖 - Win32 GDI 后端
# ============================================================================
[target.'cfg(target_os = "windows")'.dependencies]
# 使用 windows-sys 替代 windows crate，减小体积（无 proc-macro 依赖）
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
winapi = { version = "0.3", optional = true, features = ["mmsystem"] }
# Windows 使用 small_rng，种子由 RtlGenRandom 提供（无需 getrandom crate）
rand = { version = "0.8", default-features = false, features = ["alloc", "small_rng"] }
# hashbrown 替代 std HashMap/HashSet，避免 BCryptGenRandom 依赖（兼容 Win7）
hashbrown = "0.15"

[features]
# 不在默认 feature 中启用 wgpu-backend，避免在 wasm 或未显式启用的构建中拉入大型 GPU 依赖
default = ["dark-theme"]   # 默认仅启用暗黑主题适配
logging = ["dep:tracing", "dep:tracing-subscriber"]
wgpu-backend = ["dep:winit", "dep:wgpu", "dep:bytemuck", "dep:futures", "dep:windows-sys"]  # wgpu 渲染后端（跨平台，体积大）
wxgame-cpu-backend = []  # 微信小游戏 CPU 渲染版本（纯软件渲染，无额外依赖）
gdi-backend = ["dep:windows-sys"]         # Windows GDI（仅用于窗口创建，渲染使用GPU）
cpu-backend = ["gdi-backend"]             # CPU软件渲染后端（XP兼容，使用GDI显示）
dark-theme = []                           # 暗黑主题适配（需要 Vista+ dwmapi.dll）
touch-panel = []                          # 触摸控制面板 (2D绘图)
android = ["touch-panel", "wgpu-backend"]  # Android 平台后端 (GPU加速 + CPU自动fallback)

# 调试版本 feature：原有 mario 二进制不启用，避免引入调试代码
debug-bridge = ["dep:serde", "dep:serde_json", "dep:rmp-serde"]
debug-vis = ["wgpu-backend", "debug-bridge"]
debug-headless = ["debug-bridge"]

# ============================================================================
# Release 编译优化 - 最小体积
# ============================================================================
# ============================================================================
# 构建依赖 - Windows 图标嵌入
# ============================================================================
[build-dependencies]
embed-resource = "3.0"

# ============================================================================
# 开发依赖 - 仅用于示例和测试
# ============================================================================
[dev-dependencies]
# Core dev-deps kept minimal for tools that run in all targets
png = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Dev dependencies that should not be compiled for wasm32 (avoid pulling tracing into wasm builds)
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
wgpu = { version = "28.0.0", default-features = false, features = ["wgsl", "vulkan"] }
bytemuck = { version = "1.21", features = ["derive"] }
futures = "0.3"

[profile.release]
opt-level = "z"         # 优化体积而非速度
lto = true              # 链接时优化，消除未使用代码 (cargo-zbuild 兼容性使用 true 而非 "fat")
codegen-units = 1       # 单代码生成单元，更好的优化
panic = "abort"         # 不使用 unwind，减少 panic 处理代码
strip = true            # 移除符号表和调试信息
debug = 0

# ============================================================================
# 调试版本二进制入口
# ============================================================================
[[bin]]
name = "mario-debug-headless"
path = "src/bin/mario_debug_headless.rs"
required-features = ["debug-headless"]

[[bin]]
name = "mario-debug-vis"
path = "src/bin/mario_debug_vis.rs"
required-features = ["debug-vis"]

# ============================================================================
# 调试版本集成测试
# ============================================================================
[[test]]
name = "debug_headless"
path = "tests/debug_headless.rs"
required-features = ["debug-headless"]
